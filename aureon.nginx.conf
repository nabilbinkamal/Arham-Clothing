server {
    client_max_body_size 50M;
    server_name aureonbd.com www.aureonbd.com;
    root /var/www/aureon;
    index index.html;

    limit_conn conn_limit_per_ip 20;
    limit_req zone=req_limit_per_ip burst=50 nodelay;

    # GZIP Compression for MAXIMUM speed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Block empty or suspiciously short user agents
    if ($http_user_agent ~* "^(-|)$") {
        return 403;
    }
    if ($http_user_agent ~* "(curl|wget|python|urllib|ruby|perl)") {
        return 403;
    }

    # IMPORTANT: ^~ modifier makes this prefix match take precedence over regex locations
    location ^~ /uploads/ {
        proxy_pass http://localhost:5000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Browser Caching for Static Assets (Images, Fonts, JS, CSS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location = /robots.txt { proxy_pass http://localhost:5000/robots.txt; }
    location = /sitemap.xml { proxy_pass http://localhost:5000/sitemap.xml; }
    location ~ ^/google-site-verification-[A-Za-z0-9_-]+\.html$ { proxy_pass http://localhost:5000; }
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/aureonbd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aureonbd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name aureonbd.com www.aureonbd.com 152.67.0.141 _;

    if ($host = www.aureonbd.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = aureonbd.com) {
        return 301 https://$host$request_uri;
    }

    # Serve site on direct IP or fallback
    root /var/www/aureon;
    index index.html;
    client_max_body_size 50M;

    location ^~ /uploads/ {
        proxy_pass http://localhost:5000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
